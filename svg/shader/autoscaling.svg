<metadata class="illos-field" data-cycle="4.2"><![CDATA[float load(float t) { return 0.5 - 0.5 * cos(TAU * t / T); }
float field(vec2 p, float t) {
  float L = load(t);
  vec2 C = vec2(210.0, 236.0);
  // the load: a body that swells with it, its surface churning
  float churn = 0.12 * sin(p.y * 0.09 + TAU * 2.0 * t / T) + 0.08 * sin(p.x * 0.07 - TAU * 3.0 * t / T);
  float v = blob(p, C, 58.0 + 34.0 * L, 0.9 + churn);
  // the instances: two always on; the rest bud off the body's edge as the load passes their threshold
  vec2 S[5]; S[0] = vec2(480.0, 236.0); S[1] = vec2(560.0, 160.0); S[2] = vec2(560.0, 312.0); S[3] = vec2(640.0, 236.0); S[4] = vec2(480.0, 100.0);
  float th[5]; th[0] = -1.0; th[1] = -1.0; th[2] = 0.25; th[3] = 0.5; th[4] = 0.75;
  for (int i = 0; i < 5; i++) {
    float a = th[i] < 0.0 ? 1.0 : smoothstep(th[i] - 0.1, th[i] + 0.1, L);
    vec2 edge = C + normalize(S[i] - C) * (58.0 + 34.0 * L);
    vec2 at = mix(edge, S[i], a);
    v += blob(p, at, 22.0 * (0.55 + 0.45 * a), 1.0 * a);
    // a thin stalk while it buds, gone once it has settled
    v += seg(p, edge, at, 6.0, 0.4 * a * (1.0 - a) * 4.0);
  }
  return v;
}]]></metadata>

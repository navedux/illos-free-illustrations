<metadata class="illos-field" data-cycle="4.2"><![CDATA[float chan(float b) { return b < 0.5 ? 110.0 : b < 1.5 ? 230.0 : 350.0; }
vec2 onBranch(float b, float u) { vec2 N = vec2(232.0, 230.0); float x = mix(N.x + 20.0, 560.0, u); return vec2(x, N.y + (chan(b) - N.y) * smoothstep(N.x, 560.0, x)); }
float field(vec2 p, float t) {
  vec2 N = vec2(232.0, 230.0);
  float v = blob(p, N, 26.0, 1.05);
  // the channels: one in, three out
  v += seg(p, vec2(20.0, 230.0), N, 5.0, 0.4);
  if (p.x > N.x && p.x < 566.0) for (int b = 0; b < 3; b++) { float y = N.y + (chan(float(b)) - N.y) * smoothstep(N.x, 560.0, p.x); v += 0.4 * exp(-pow(p.y - y, 2.0) / 25.0); }
  // six packets a cycle: in along the stream, then out along channel i mod 3
  for (int i = 0; i < 6; i++) for (int w = -1; w <= 1; w++) {
    float a = 0.35 + 0.7 * float(i) + float(w) * T; // when it reaches the balancer
    float b = mod(float(i), 3.0);
    if (t > a - 1.0 && t < a) { float x = N.x - (a - t) * 212.0; v += blob(p, vec2(x, 230.0), 9.0, 1.15) + blob(p, vec2(x - 12.0, 230.0), 7.0, 0.4); }
    if (t >= a && t < a + 1.1) { float u = ease((t - a) / 1.1); v += blob(p, onBranch(b, u), 9.0, 1.15); }
    float arr = a + 1.1;
    v += 0.55 * exp(-pow(t - arr, 2.0) / 0.03) * blob(p, vec2(590.0, chan(b)), 30.0, 1.0);
  }
  for (int b = 0; b < 3; b++) v += blob(p, vec2(590.0, chan(float(b))), 28.0, 0.72);
  return v;
}]]></metadata>

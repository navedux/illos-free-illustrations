<svg class="sh-vector-search" xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" fill="none" stroke="#1daf9c" role="img" aria-labelledby="sh-vector-search-t">
<title id="sh-vector-search-t">Vector search</title>
<style>@scope (svg.sh-vector-search) {

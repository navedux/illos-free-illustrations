<metadata class="illos-field" data-cycle="4.2"><![CDATA[float field(vec2 p, float t) {
  if (p.x < 30.0 || p.x > 690.0) return 0.0;
  float ph = TAU * t / T;
  // how raw the stream still is: 1 before the first sieve, less after each
  float raw = 1.0 - 0.34 * step(240.0, p.x) - 0.33 * step(380.0, p.x) - 0.3 * step(520.0, p.x);
  float soft = 1.0 - 0.34 * sm(220.0, 260.0, p.x) - 0.33 * sm(360.0, 400.0, p.x) - 0.3 * sm(500.0, 540.0, p.x);
  // turbulence that flows right, periodic in the cycle so the loop closes
  float wob = sin(p.x * 0.045 - ph * 3.0 + sin(p.x * 0.013 + ph)) * 52.0 + sin(p.x * 0.11 - ph * 5.0) * 18.0;
  float y = 232.0 + wob * soft;
  float spread = 14.0 + 40.0 * soft;
  // grit flows with the stream, 72 columns a cycle, and its pattern repeats over those, so the loop closes
  float grit = soft > 0.2 ? step(0.55 - 0.3 * (1.0 - soft), hash(vec2(mod(floor((p.x - 504.0 * t / T) / 7.0), 72.0), floor(p.y / 9.4)))) : 1.0;
  float pulse = 0.55 + 0.45 * pow(0.5 + 0.5 * sin(p.x * 0.06 - ph * 6.0), 3.0);
  float v = exp(-pow(p.y - y, 2.0) / (spread * spread)) * pulse * (0.55 + 0.45 * grit) * (0.7 + 0.3 * (1.0 - soft));
  return v;
}]]></metadata>

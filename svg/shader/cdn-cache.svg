<rect class="sh-clock" width="0" height="0"/>
<metadata class="illos-field" data-cycle="4.2"><![CDATA[float field(vec2 p, float t) {
  vec2 O = vec2(360.0, 232.0);
  vec2 d = (p - O) / vec2(250.0, 190.0);
  float r = length(d);
  float v = 0.0;
  // the world: a sparse globe of points with latitude rings and meridians, slowly turning. It turns 2.5 radians a
  // cycle, which moves the point grid (6 a radian) and the meridians (1.6 a radian) a whole number of steps.
  if (r < 1.0) {
    float lon = atan(d.x, sqrt(max(0.0, 1.0 - r * r))) + 2.5 * t / T;
    float ring = abs(fract(d.y * 3.0) - 0.5) < 0.08 ? 0.32 : 0.0;
    float meridian = abs(fract(lon * 1.6) - 0.5) < 0.05 ? 0.28 : 0.0;
    float pt = hash(floor(p / vec2(7.0, 9.4)) + mod(floor(lon * 6.0), 15.0)) > 0.84 ? 0.36 : 0.0; // 15 steps a cycle, wrapped
    v += max(max(ring, meridian), pt) * (1.0 - r * 0.45);
  }
  v += 0.42 * exp(-pow(r - 1.0, 2.0) / 0.0009); // the world's rim
  v += blob(p, O, 30.0, 1.1); // the origin
  vec2 E[5]; E[0] = vec2(190.0, 150.0); E[1] = vec2(540.0, 130.0); E[2] = vec2(590.0, 300.0); E[3] = vec2(230.0, 330.0); E[4] = vec2(390.0, 380.0);
  float R = 360.0 * sm(0.2, 1.3, t); // the fill wave
  if (t > 0.2 && t < 1.5) v += 0.45 * (1.0 - sm(0.9, 1.5, t)) * exp(-pow(length((p - O) * vec2(1.0, 1.3)) - R, 2.0) / 200.0);
  float cool = 1.0 - sm(3.6, 4.15, t);
  for (int i = 0; i < 5; i++) {
    float lit = sm(0.0, 0.08, R - length((E[i] - O) * vec2(1.0, 1.3)) / 360.0 * 360.0 + 0.0) * cool;
    // a user near this edge asks at its own moment, and the edge answers locally
    float at = 1.7 + 0.38 * float(i);
    vec2 U = E[i] + vec2(46.0 * cos(float(i) * 2.3), 30.0 * sin(float(i) * 1.7));
    float ask = exp(-pow(t - at, 2.0) / 0.01);
    float answer = exp(-pow(t - at - 0.18, 2.0) / 0.02);
    v += blob(p, E[i], 16.0, 0.45 + 0.4 * lit + 0.5 * answer);
    v += blob(p, U, 7.0, 1.2 * ask) + seg(p, U, E[i], 4.0, 0.8 * answer);
  }
  return v;
}]]></metadata>
